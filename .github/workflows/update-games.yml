name: Update DFW Games

on:
  workflow_dispatch:

  schedule:
    - cron: "0 8 * * 1,3,5"
      timezone: "America/Chicago"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenAI SDK
        run: pip install --upgrade openai

      - name: Research and rank games
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/update_games.py

      - name: Commit updated games
        run: |
          git config user.name "DFW Game Finder Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/games.json
          if git diff --cached --quiet; then
            echo "No game-data changes to commit."
          else
            git commit -m "Update DFW game rankings"
            git push
          fi
