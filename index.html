<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DFW Game Finder</title>
<style>
:root{--bg:#08101d;--panel:#111b2d;--text:#f7f8fb;--muted:#a7b3c7;--accent:#4f8cff;--border:#293853;--chip:#162742}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#08101d,#0f1829);color:var(--text);font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:1100px;margin:auto;padding:24px}.header{display:flex;justify-content:space-between;gap:16px;align-items:end;flex-wrap:wrap}
h1{font-size:34px;margin:6px 0 8px}.muted{color:var(--muted)}.live{padding:8px 11px;border:1px solid var(--border);background:var(--chip);border-radius:999px;font-size:13px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.metric,.panel,.game{background:var(--panel);border:1px solid var(--border);border-radius:16px}
.metric{padding:15px}.metric b{display:block;font-size:26px;margin-top:5px}.panel{padding:16px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
label{font-size:13px;color:var(--muted)}input,select{width:100%;margin-top:6px;padding:10px;border:1px solid var(--border);background:#0c1627;color:var(--text);border-radius:10px;font:inherit}
.section{margin-top:25px}.game{padding:18px;margin:12px 0}.top{display:flex;justify-content:space-between;gap:14px}.match{font-size:19px;font-weight:700}.score{font-size:30px;font-weight:700;color:var(--accent);text-align:right}
.badge,.chip{display:inline-block;border:1px solid var(--border);background:var(--chip);border-radius:999px;padding:5px 9px;font-size:12px}.badge{margin-top:5px}
.track{height:10px;background:#26344c;border-radius:999px;overflow:hidden;margin:13px 0}.fill{height:100%;background:var(--accent)}
.details{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;border-top:1px solid var(--border);padding-top:13px}.details span{display:block;color:var(--muted);font-size:12px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.why{margin:10px 0 0}.sources{margin-top:12px;font-size:12px}.sources a{color:#9ec1ff}
.status{padding:24px;text-align:center;color:var(--muted)}
@media(max-width:720px){.metrics,.details{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr}.top{flex-direction:column}.score{text-align:left}}
@media(max-width:430px){.metrics,.details{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="header">
  <div>
    <div class="muted">DFW High School Football • Auto-updated by GitHub</div>
    <h1>DFW Game Finder</h1>
    <div class="muted">40% Team Quality • 35% Recruit Talent • 15% Matchup • 10% Importance</div>
  </div>
  <div class="live" id="mode">Loading…</div>
</div>

<div class="metrics">
  <div class="metric"><span class="muted">Games ranked</span><b id="count">—</b></div>
  <div class="metric"><span class="muted">Must-see</span><b id="must">—</b></div>
  <div class="metric"><span class="muted">Top score</span><b id="topscore">—</b></div>
  <div class="metric"><span class="muted">Week</span><b id="week" style="font-size:16px">—</b></div>
</div>

<div class="panel filters">
  <label>Search<input id="search" placeholder="Allen, Duncanville..."></label>
  <label>Minimum score<select id="min"><option value="0">All</option><option value="80">80+</option><option value="90">90+</option></select></label>
  <label>Sort<select id="sort"><option value="gameScore">Game Score</option><option value="recruitTalent">Recruit Talent</option><option value="teamQuality">Team Quality</option><option value="matchupQuality">Closest Matchup</option></select></label>
</div>

<div class="section">
  <h2>Top DFW Games</h2>
  <div class="muted" id="updated">Loading current data…</div>
  <div id="list"><div class="game status">Loading games…</div></div>
</div>
</div>

<script>
let all=[];const $=id=>document.getElementById(id);
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function badge(s){return s>=93?'🔥 Must See':s>=87?'⭐ Excellent':s>=80?'👀 Worth Watching':'Solid Matchup'}
function render(){
 const q=$('search').value.toLowerCase().trim(),min=+$('min').value,sort=$('sort').value;
 let g=all.filter(x=>(!q||(x.away+' '+x.home).toLowerCase().includes(q))&&x.gameScore>=min);
 g.sort((a,b)=>b[sort]-a[sort]);
 $('list').innerHTML=g.length?g.map((x,i)=>`<article class="game"><div class="top"><div><div class="match">${i+1}. ${esc(x.away)} <span class="muted">at</span> ${esc(x.home)}</div><div class="muted">${esc(x.date)} • ${esc(x.time)}${x.venue?' • '+esc(x.venue):''}</div><p class="why">${esc(x.reason)}</p></div><div><div class="score">${x.gameScore}<span style="font-size:13px;color:var(--muted)">/100</span></div><span class="badge">${badge(x.gameScore)}</span></div></div><div class="track"><div class="fill" style="width:${x.gameScore}%"></div></div><div class="details"><div><span>Team Quality</span><b>${x.teamQuality}</b></div><div><span>Recruit Talent</span><b>${x.recruitTalent}</b></div><div><span>Matchup</span><b>${x.matchupQuality}</b></div><div><span>Importance</span><b>${x.importance}</b></div></div>${x.notableRecruits?.length?`<div class="chips">${x.notableRecruits.map(r=>`<span class="chip">${esc(r)}</span>`).join('')}</div>`:''}${x.sources?.length?`<div class="sources">${x.sources.slice(0,4).map((u,n)=>`<a href="${esc(u)}" target="_blank" rel="noopener">Source ${n+1}</a>`).join(' • ')}</div>`:''}</article>`).join(''):'<div class="game status">No games match.</div>'
}
async function load(){
 try{
  const r=await fetch('/games.json?ts='+Date.now(),{cache:'no-store'});
  const d=await r.json();all=d.games||[];
  $('count').textContent=all.length;$('must').textContent=all.filter(x=>x.gameScore>=93).length;$('topscore').textContent=all[0]?.gameScore??'—';
  $('week').textContent=d.weekLabel||'Current';$('mode').textContent=d.sourceMode==='live'?'● Live researched data':'● Seed data';
  $('updated').textContent='Last update: '+new Date(d.updatedAt).toLocaleString();render()
 }catch(e){$('mode').textContent='Data error';$('list').innerHTML='<div class="game status">'+esc(e.message)+'</div>'}
}
$('search').addEventListener('input',render);$('min').addEventListener('change',render);$('sort').addEventListener('change',render);load();
</script>
</body>
</html>
